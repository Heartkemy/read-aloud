name: Bug report
description: Report a reproducible read-aloud problem
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use synthetic text only. Include the smallest steps and expected versus actual result.
      placeholder: "1. Start the local service\n2. Request a synthetic passage\n3. Observe..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, operating system, and adapter (Vite, Express, or Fetch).
    validations:
      required: true
